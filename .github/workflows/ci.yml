name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libxtst-dev libxdo-dev libxcb1-dev libxcb-xkb-dev libxcb-randr0-dev libfontconfig-dev libasound2-dev libdbus-1-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci
      - name: Check the 32-bit and ARM64 builds
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc aarch64-pc-windows-msvc
          cargo check --workspace --target i686-pc-windows-msvc
          cargo check --workspace --target aarch64-pc-windows-msvc

  # Publishes a GitHub release with the 64-bit, 32-bit and ARM64 exes whenever the version in
  # crates/app/Cargo.toml has no release yet. Bump it to ship a new one.
  release:
    needs: ci
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="copyanywhere") | .version')" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # Nightly rebuilds std with immediate-abort panics, which makes the exe about 1 MiB smaller.
      # Pinned so a later nightly renaming the flags cannot break a release.
      - name: Install nightly
        if: steps.exists.outputs.found == 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-29
          components: rust-src
      - name: Build release exes
        if: steps.exists.outputs.found == 'false'
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_PANIC: immediate-abort
        run: |
          for target in x86_64-pc-windows-msvc i686-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo build --release -p copyanywhere -Zbuild-std=std,panic_abort -Zpanic-immediate-abort --target $target
          done
      - name: Publish release
        if: steps.exists.outputs.found == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Asset names must match release_feed.rs, which the self-updater looks them up by.
          cp target/x86_64-pc-windows-msvc/release/copyanywhere.exe CopyAnywhere-x64.exe
          cp target/i686-pc-windows-msvc/release/copyanywhere.exe CopyAnywhere-x86.exe
          cp target/aarch64-pc-windows-msvc/release/copyanywhere.exe CopyAnywhere-arm64.exe
          sha256sum CopyAnywhere-x64.exe > CopyAnywhere-x64.exe.sha256
          sha256sum CopyAnywhere-x86.exe > CopyAnywhere-x86.exe.sha256
          sha256sum CopyAnywhere-arm64.exe > CopyAnywhere-arm64.exe.sha256
          gh release create "${{ steps.version.outputs.tag }}" CopyAnywhere-*.exe CopyAnywhere-*.exe.sha256 \
            --target "${{ github.sha }}" \
            --title "CopyAnywhere ${{ steps.version.outputs.tag }}" \
            --generate-notes

  # Adds the macOS and Linux binaries to the release the job above created. The updater looks
  # them up by the names release_feed.rs builds.
  release-unix:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: CopyAnywhere-linux-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: CopyAnywhere-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: CopyAnywhere-macos-x64 }
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="copyanywhere") | .version')" >> "$GITHUB_OUTPUT"
      - name: Check the release for this asset
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --json assets --jq '.assets[].name' | grep -qx "${{ matrix.asset }}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux libraries
        if: steps.exists.outputs.found == 'false' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libxtst-dev libxdo-dev libxcb1-dev libxcb-xkb-dev libxcb-randr0-dev libfontconfig-dev libasound2-dev libdbus-1-dev libssl-dev
      - name: Add the Rust target
        if: steps.exists.outputs.found == 'false'
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: steps.exists.outputs.found == 'false'
      - name: Build and upload
        if: steps.exists.outputs.found == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release -p copyanywhere --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/copyanywhere ${{ matrix.asset }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          gh release upload "${{ steps.version.outputs.tag }}" ${{ matrix.asset }} ${{ matrix.asset }}.sha256

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

  # Publishes a GitHub release with the exe whenever the version in
  # crates/app/Cargo.toml has no release yet. Bump it to ship a new one.
  release:
    needs: ci
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="copyanywhere") | .version')" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # Nightly rebuilds std with immediate-abort panics, which makes the exe about 1 MiB smaller.
      # Pinned so a later nightly renaming the flags cannot break a release.
      - name: Install nightly
        if: steps.exists.outputs.found == 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-29
          components: rust-src
      - name: Build release exe
        if: steps.exists.outputs.found == 'false'
        env:
          CARGO_PROFILE_RELEASE_PANIC: immediate-abort
        run: cargo build --release -p copyanywhere -Zbuild-std=std,panic_abort -Zpanic-immediate-abort --target x86_64-pc-windows-msvc
      - name: Publish release
        if: steps.exists.outputs.found == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/x86_64-pc-windows-msvc/release/copyanywhere.exe CopyAnywhere.exe
          sha256sum CopyAnywhere.exe > CopyAnywhere.exe.sha256
          gh release create "${{ steps.version.outputs.tag }}" CopyAnywhere.exe CopyAnywhere.exe.sha256 \
            --target "${{ github.sha }}" \
            --title "CopyAnywhere ${{ steps.version.outputs.tag }}" \
            --generate-notes

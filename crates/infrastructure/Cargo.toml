[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
anyhow = "1"
serde_json = "1"
winreg = "0.55"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_UI_Controls_Dialogs",
]
